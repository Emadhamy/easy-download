[package]
name = "easy_download_core"
version = "0.1.0"
edition = "2021"
description = "Core types and direct HTTP(S) download support for Easy Download"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
flutter_rust_bridge = "2.12.0"
serde_json = "1"
url = "2.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
