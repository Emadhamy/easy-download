plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.easydownload.app"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }

    defaultConfig {
        applicationId "com.easydownload.app"
        // youtubedl-android requires Android API 24 or newer.
        minSdk 24
        targetSdk flutter.targetSdkVersion
        // This APK and the Rust Android core are currently built for ARM64 only.
        // Keep dependency-provided 32-bit native libraries out of the packaged APK.
        ndk { abiFilters "arm64-v8a" }
        versionCode flutter.versionCode
        versionName flutter.versionName
    }
    packaging {
        jniLibs {
            useLegacyPackaging = true
            // The current APK is ARM64-only; exclude native payloads for unsupported ABIs.
            excludes += [
                "**/armeabi-v7a/**",
                "**/armeabi/**",
                "**/x86/**",
                "**/x86_64/**"
            ]
        }
    }

    sourceSets { main { jniLibs.srcDirs = ["src/main/jniLibs"] } }
}

dependencies {
    implementation "androidx.documentfile:documentfile:1.0.1"
    implementation "io.github.junkfood02.youtubedl-android:library:0.18.1"
}

flutter { source "../.." }
