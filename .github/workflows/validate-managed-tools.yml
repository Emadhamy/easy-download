name: Validate managed tools manifest

on:
  push:
    paths:
      - 'rust/resources/managed-tools/manifest.json'
      - 'rust/resources/managed-tools/manifest.schema.json'
      - '.github/workflows/validate-managed-tools.yml'
      - 'rust/Cargo.toml'
      - 'rust/Cargo.lock'
      - 'rust/src/**/*.rs'
      - 'flutter_rust_bridge.yaml'
      - 'lib/src/rust/**'
  pull_request:
    paths:
      - 'rust/resources/managed-tools/manifest.json'
      - 'rust/resources/managed-tools/manifest.schema.json'
      - '.github/workflows/validate-managed-tools.yml'
      - 'rust/Cargo.toml'
      - 'rust/Cargo.lock'
      - 'rust/src/**/*.rs'
      - 'flutter_rust_bridge.yaml'
      - 'lib/src/rust/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-manifest:
    name: Validate managed tools manifest JSON and schema
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Flutter for bridge generation
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter Rust Bridge code generator
        run: cargo install flutter_rust_bridge_codegen --version 2.12.0 --locked

      - name: Generate Rust bridge module
        run: flutter_rust_bridge_codegen generate

      - name: Run Rust unit tests
        run: cargo test --manifest-path rust/Cargo.toml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install JSON Schema validator
        run: python -m pip install --disable-pip-version-check jsonschema

      - name: Run managed tools manifest unit tests
        run: python -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Validate manifest and negative cases
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker

          manifest_path = Path('rust/resources/managed-tools/manifest.json')
          schema_path = Path('rust/resources/managed-tools/manifest.schema.json')
          with manifest_path.open(encoding='utf-8') as f:
              manifest = json.load(f)
          with schema_path.open(encoding='utf-8') as f:
              schema = json.load(f)

          Draft202012Validator.check_schema(schema)
          validator = Draft202012Validator(schema, format_checker=FormatChecker())
          errors = sorted(validator.iter_errors(manifest), key=lambda e: list(map(str, e.path)))
          if errors:
              for error in errors:
                  path = '.'.join(map(str, error.absolute_path)) or '<root>'
                  print(f'{path}: {error.message}')
              raise SystemExit(1)
          print('Managed tools manifest matches its JSON Schema.')

          # Negative cases: malformed hashes and incomplete release records must fail.
          import copy
          valid = copy.deepcopy(manifest)
          valid['tools']['ytDlp']['enabled'] = True
          valid['tools']['ytDlp']['releases'] = {
              'linux-x86_64': {
                  'version': 'test',
                  'url': 'https://example.invalid/tool',
                  'archiveFormat': 'binary',
                  'sha256': 'z' * 64,
                  'executablePath': 'tool'
              }
          }
          if not list(validator.iter_errors(valid)):
              raise SystemExit('Negative test failed: invalid SHA-256 was accepted.')

          valid['tools']['ytDlp']['releases']['linux-x86_64']['sha256'] = '0' * 64
          del valid['tools']['ytDlp']['releases']['linux-x86_64']['version']
          if not list(validator.iter_errors(valid)):
              raise SystemExit('Negative test failed: incomplete release was accepted.')

          # Enabled tools must have at least one configured release.
          enabled_without_release = copy.deepcopy(manifest)
          enabled_without_release['tools']['ytDlp']['enabled'] = True
          if enabled_without_release['tools']['ytDlp']['releases']:
              raise SystemExit('Negative test setup failed: expected empty releases.')
          if not list(validator.iter_errors(enabled_without_release)):
              raise SystemExit('Negative test failed: enabled tool without a release was accepted.')
          print('Negative test passed: enabled tool without a release is rejected by the schema.')
          print('Negative validation cases passed.')
          PY
