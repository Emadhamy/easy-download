name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  flutter-check:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

  rust-check:
    name: Rust tests and bridge generation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Flutter Rust Bridge code generator
        run: cargo install flutter_rust_bridge_codegen --version 2.12.0 --locked

      - name: Generate Flutter-Rust bridge
        run: flutter_rust_bridge_codegen generate

      - name: Upload generated bridge files
        uses: actions/upload-artifact@v4
        with:
          name: flutter-rust-bridge-generated
          path: lib/src/rust/
          if-no-files-found: error

      - name: Run Rust tests
        working-directory: rust
        run: cargo test
