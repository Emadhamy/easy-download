name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  flutter-check:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Rust for bridge generation
        uses: dtolnay/rust-toolchain@stable

      - name: Install Flutter Rust Bridge code generator
        run: cargo install flutter_rust_bridge_codegen --version 2.12.0 --locked

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate Flutter-Rust bridge before analysis
        run: |
          set -e
          flutter_rust_bridge_codegen generate
          test -s rust/src/frb_generated.rs

      - name: Analyze Flutter code
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test

  android-rust-build:
    name: Build Rust core for Android
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter for bridge generation
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter Rust Bridge code generator
        run: cargo install flutter_rust_bridge_codegen --version 2.12.0 --locked

      - name: Generate Flutter-Rust bridge for Android build
        run: flutter_rust_bridge_codegen generate

      - name: Set up Rust with Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Android NDK
        shell: bash
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager -perm -u+x -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $SDK_ROOT"
            exit 1
          fi
          echo "Using SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rust core for Android ARM64
        working-directory: rust
        run: cargo ndk -t arm64-v8a -o ../build/android/jniLibs build --release

      - name: Upload Android native library
        uses: actions/upload-artifact@v4
        with:
          name: easy-download-android-arm64
          path: build/android/jniLibs/
          if-no-files-found: error


  rust-check:
    name: Rust tests and bridge generation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Flutter for bridge generation
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter Rust Bridge code generator
        run: cargo install flutter_rust_bridge_codegen --version 2.12.0 --locked

      - name: Generate Flutter-Rust bridge
        run: flutter_rust_bridge_codegen generate

      - name: Commit generated bridge files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/rust/ rust/src/frb_generated.rs
          if ! git diff --cached --quiet; then
            git commit -m "Update generated Flutter Rust bridge"
            git push
          fi

      - name: Upload generated bridge files
        uses: actions/upload-artifact@v4
        with:
          name: flutter-rust-bridge-generated
          path: |
            lib/src/rust/
            rust/src/frb_generated.rs
          if-no-files-found: error

      - name: Run Rust tests
        working-directory: rust
        run: cargo test
